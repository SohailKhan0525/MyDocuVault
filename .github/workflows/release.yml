name: Release Android
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-android
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_FILE: app/keystore/mydocvault.keystore
      FIREBASE_ANDROID_CONFIG: ${{ vars.FIREBASE_ANDROID_CONFIG }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: version
        shell: bash
        run: python3 .github/scripts/release_version.py
      - uses: actions/setup-java@v4
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: ./.github/actions/office-packages
        if: steps.version.outputs.publish == 'true'
      - name: Test and assemble signed APK
        if: steps.version.outputs.publish == 'true'
        run: |
          test -f "$KEYSTORE_FILE"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease :reader:assembleRelease --no-daemon
      - name: Verify signature and publish
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          apk="MyDocuVault-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          signer="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$signer" verify --print-certs "$apk" > signing-certificate.txt
          grep -Fx "Signer #1 certificate SHA-256 digest: dac0d06970b08037a30773fea0d58d8494750fec294a357c543d1cf70d5af5b5" signing-certificate.txt
          bytes=$(stat -c %s "$apk")
          echo "Main APK: $bytes bytes"
          test "$bytes" -le 50000000
          sha256sum "$apk" > "$apk.sha256"
          assets=("$apk" "$apk.sha256")
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            reader="MyDocuVault-Reader-1-$abi.apk"
            cp "reader/build/outputs/apk/release/reader-$abi-release.apk" "$reader"
            "$signer" verify --print-certs "$reader" | grep -Fx "Signer #1 certificate SHA-256 digest: dac0d06970b08037a30773fea0d58d8494750fec294a357c543d1cf70d5af5b5"
            sha256sum "$reader" > "$reader.sha256"
            assets+=("$reader" "$reader.sha256")
          done
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" \
            --title "MyDocuVault $TAG" --notes-file "releases/$TAG.md" "${flags[@]}"

      - name: Notify opted-in phones
        if: steps.version.outputs.publish == 'true' && steps.version.outputs.prerelease != 'true' && env.FIREBASE_ANDROID_CONFIG != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          FCM_CREDENTIALS: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "$FCM_CREDENTIALS" ]]; then
            echo "::warning::FCM_SERVICE_ACCOUNT is missing. Background release checks still work."
            exit 0
          fi
          python -m pip install --quiet 'google-auth[requests]>=2.25,<3'
          python .github/scripts/notify_release.py
