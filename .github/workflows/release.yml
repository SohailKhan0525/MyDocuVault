name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read version from build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | sed 's/[^0-9]//g')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "app/build/outputs/apk/debug/MyDocuVault-v${{ steps.version.outputs.version_name }}-debug.apk"
          fi
          if [ -z "$RELEASE_APK" ]; then
            echo "Error: No release APK found in app/build/outputs/apk/release"
            exit 1
          fi
          echo "Release APK found at: $RELEASE_APK"
          cp "$RELEASE_APK" "app/build/outputs/apk/release/MyDocuVault-v${{ steps.version.outputs.version_name }}.apk"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDocuVault-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/MyDocuVault-v${{ steps.version.outputs.version_name }}.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDocuVault-v${{ steps.version.outputs.version_name }}-debug
          path: app/build/outputs/apk/debug/MyDocuVault-v${{ steps.version.outputs.version_name }}-debug.apk
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: MyDocuVault v${{ steps.version.outputs.version_name }}
          body: |
            ## MyDocuVault v${{ steps.version.outputs.version_name }}

            ### What's New
            - Fixed images not loading: viewer now uses `File` model for reliable Coil image loading
            - Fixed PDF rendering: cancelled renders no longer show spurious error messages
            - Fixed folder title: folder detail screen now displays the actual folder name
            - Fixed DocxTextExtractor resource leak: ZipFile is always closed properly
            - Fixed VaultFileManager: parent directory is created before writing files
            - Improved security: CancellationException is always rethrown correctly
            - Version ${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})

            ### Downloads
            | APK | Description |
            |-----|-------------|
            | `MyDocuVault-v${{ steps.version.outputs.version_name }}.apk` | Release build (use this to install/update) |
            | `MyDocuVault-v${{ steps.version.outputs.version_name }}-debug.apk` | Debug build (for testing) |

            ### Installation
            Download and install the APK on your Android device (API 26+).
            Enable **Install from unknown sources** in your device settings if prompted.

            ---
            Made with ❤️ by Mohd Zaheer Uddin
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/MyDocuVault-v${{ steps.version.outputs.version_name }}.apk
            app/build/outputs/apk/debug/MyDocuVault-v${{ steps.version.outputs.version_name }}-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
