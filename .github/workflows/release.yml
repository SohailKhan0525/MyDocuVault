name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read version from build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | sed 's/[^0-9]//g')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename Debug APK
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$DEBUG_APK" ]; then
            echo "Error: No debug APK found in app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Debug APK found at: $DEBUG_APK"
          cp "$DEBUG_APK" "app/build/outputs/apk/debug/MyDocuVault-v${{ steps.version.outputs.version_name }}-debug.apk"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDocuVault-v${{ steps.version.outputs.version_name }}-debug
          path: app/build/outputs/apk/debug/MyDocuVault-v${{ steps.version.outputs.version_name }}-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: MyDocuVault v${{ steps.version.outputs.version_name }}
          body: |
            ## MyDocuVault v${{ steps.version.outputs.version_name }}

            ### What's New
            - Version ${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})
            - Backup & Restore: zip all documents and Room database to Documents/MyDocuVaultBackup/ with timestamp
            - Auto-backup every 8 hours via WorkManager (runs when battery is not low)
            - Restore from any previous backup ZIP file
            - Backup and restore notifications

            ### Downloads
            | APK | Description |
            |-----|-------------|
            | `MyDocuVault-v${{ steps.version.outputs.version_name }}-debug.apk` | Debug build for testing |

            ### Installation
            Download and install the APK on your Android device (API 26+).
            Enable **Install from unknown sources** in your device settings if prompted.

            ---
            Made with ❤️ by Mohd Zaheer Uddin
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/MyDocuVault-v${{ steps.version.outputs.version_name }}-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
