name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_FILE: app/keystore/mydocvault.keystore
      KEYSTORE_PASSWORD: mydocvault2024
      KEY_ALIAS: mydocvault
      KEY_PASSWORD: mydocvault2024

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read version from build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | sed 's/[^0-9]//g')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "app/build/outputs/apk/debug/MyDocuVault-v${{ steps.version.outputs.version_name }}-debug.apk"
          fi
          if [ -z "$RELEASE_APK" ]; then
            echo "Error: No release APK found in app/build/outputs/apk/release"
            exit 1
          fi
          echo "Release APK found at: $RELEASE_APK"
          cp "$RELEASE_APK" "app/build/outputs/apk/release/MyDocuVault-v${{ steps.version.outputs.version_name }}.apk"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDocuVault-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/MyDocuVault-v${{ steps.version.outputs.version_name }}.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDocuVault-v${{ steps.version.outputs.version_name }}-debug
          path: app/build/outputs/apk/debug/MyDocuVault-v${{ steps.version.outputs.version_name }}-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: MyDocuVault v${{ steps.version.outputs.version_name }}
          body: |
            ## MyDocuVault v${{ steps.version.outputs.version_name }}

            ### What's New in v${{ steps.version.outputs.version_name }}
            - 🏷️ **Preserved Exact File Names**: Fixed file name changing issues across imports, disk storage, renaming, and sharing with clean duplicate handling (`file (1).pdf` instead of timestamps)
            - 📁 **Disk Folder & File Sync**: Files saved or moved inside folders are now instantly written to disk and scanned via MediaScanner so they immediately show up in file explorer apps
            - 📂 **Full Storage Permissions**: Added Scoped Storage and legacy external storage permissions for reliable document saving
            - 🔍 **Full Vault Search**: Fast real-time search across all folders and documents by name, notes, and type (PDF, Images, Word/Docs)
            - 📲 **Open with MyDocu**: Open files directly from WhatsApp, Telegram, emails, and file managers with one-tap import to chosen vault folders
            - 🚀 **In-App Update Prompt**: Automatic update prompt on HomeScreen and improved update checker headers
            - 📤 **Preserved File Names on Sharing**: Fixed file sharing to preserve original file names when sending via WhatsApp and other apps
            - Version ${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})

            ### Downloads
            | APK | Description |
            |-----|-------------|
            | `MyDocuVault-v${{ steps.version.outputs.version_name }}.apk` | Release build (use this to install/update) |
            | `MyDocuVault-v${{ steps.version.outputs.version_name }}-debug.apk` | Debug build (for testing) |

            ### Installation
            Download and install the APK on your Android device (API 26+).
            Enable **Install from unknown sources** in your device settings if prompted.

            ---
            Made with ❤️ by Mohd Zaheer Uddin
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/MyDocuVault-v${{ steps.version.outputs.version_name }}.apk
            app/build/outputs/apk/debug/MyDocuVault-v${{ steps.version.outputs.version_name }}-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
