name: Release Android
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-android
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_FILE: app/keystore/mydocvault.keystore
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: version
        shell: bash
        run: python3 .github/scripts/release_version.py
      - uses: actions/setup-java@v4
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: ./.github/actions/office-packages
        if: steps.version.outputs.publish == 'true'
      - name: Test and assemble signed APK
        if: steps.version.outputs.publish == 'true'
        run: |
          test -f "$KEYSTORE_FILE"
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Verify signature and publish
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          apk="MyDocuVault-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          signer="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$signer" verify --print-certs "$apk" > signing-certificate.txt
          grep -Fx "Signer #1 certificate SHA-256 digest: dac0d06970b08037a30773fea0d58d8494750fec294a357c543d1cf70d5af5b5" signing-certificate.txt
          sha256sum "$apk" > "$apk.sha256"
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "$apk" "$apk.sha256" --target "$GITHUB_SHA" \
            --title "MyDocuVault $TAG" --notes-file "releases/$TAG.md" "${flags[@]}"
